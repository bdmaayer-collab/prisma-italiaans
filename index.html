<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2eb">
<title>Prisma Italiaans — Les 1</title>
<style>
  :root{
    --bg:#f5f2eb;
    --card:#fffdf8;
    --ink:#1d211f;
    --muted:#747b75;
    --line:#ddd8cd;
    --accent:#176b4d;
    --accent2:#e3efe9;
    --bad:#a23f3f;
    --badbg:#f8e8e6;
    --good:#176b4d;
    --goodbg:#e4f2ea;
    --shadow:0 18px 50px rgba(33,38,34,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  button,input{font:inherit}
  body{padding:20px}
  .app{max-width:780px;margin:0 auto}
  header{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;margin:5px 0 18px}
  .eyebrow{font-size:.76rem;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:750}
  h1{font-size:clamp(1.7rem,5vw,2.55rem);line-height:1.05;margin:.3rem 0 .25rem}
  .sub{color:var(--muted);font-size:.95rem}
  .reset{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:12px;padding:9px 11px;cursor:pointer}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat{background:rgba(255,255,255,.55);border:1px solid var(--line);padding:10px;border-radius:14px;text-align:center}
  .stat b{display:block;font-size:1.08rem}
  .stat span{display:block;font-size:.72rem;color:var(--muted);margin-top:1px}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#eae5da;border-radius:15px;padding:5px;margin-bottom:14px}
  .tab{border:0;background:transparent;padding:10px 7px;border-radius:11px;cursor:pointer;font-weight:700;color:#626862}
  .tab.active{background:var(--card);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .panel{display:none}
  .panel.active{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:clamp(22px,5vw,38px)}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;font-weight:650}
  .boxpill{background:#eee9df;padding:5px 9px;border-radius:999px;color:#565c56}
  .prompt-label{margin-top:30px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800}
  .prompt{font-size:clamp(2rem,8vw,4.2rem);line-height:1.06;font-weight:760;letter-spacing:-.035em;margin:8px 0 30px;min-height:1.1em}
  .answer{font-size:clamp(1.55rem,6vw,2.8rem);line-height:1.15;font-weight:720;color:var(--accent);margin:10px 0 26px}
  .feedback{min-height:54px;border-radius:14px;padding:12px 14px;margin:0 0 14px;font-weight:650;display:flex;align-items:center}
  .feedback:empty{display:none}
  .feedback.good{background:var(--goodbg);color:var(--good)}
  .feedback.bad{background:var(--badbg);color:var(--bad)}
  .feedback.neutral{background:#efede6;color:#5d625e}
  .primary{width:100%;border:0;border-radius:16px;background:var(--accent);color:white;padding:16px 18px;font-weight:800;font-size:1.05rem;cursor:pointer;min-height:58px}
  .primary:disabled{opacity:.55;cursor:not-allowed}
  .primary.listening{animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(23,107,77,.23)}50%{box-shadow:0 0 0 12px rgba(23,107,77,0)}}
  .secondary-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .secondary{border:1px solid var(--line);background:#faf7f0;border-radius:14px;padding:12px;cursor:pointer;color:#505650;font-weight:700}
  .secondary.danger{color:var(--bad)}
  .help{font-size:.79rem;color:var(--muted);line-height:1.5;margin:13px 4px 0}
  .write-wrap{display:flex;gap:8px;margin-top:8px}
  .write-input{flex:1;border:1px solid var(--line);background:white;border-radius:14px;padding:14px 15px;outline:none;font-size:1.05rem}
  .write-input:focus{border-color:#9bb9ab;box-shadow:0 0 0 3px rgba(23,107,77,.08)}
  .smallbtn{border:0;background:#e7eee9;color:var(--accent);font-weight:800;padding:0 17px;border-radius:14px;cursor:pointer}
  .progressbar{height:8px;background:#e7e2d8;border-radius:999px;overflow:hidden;margin:14px 0 20px}
  .progressfill{height:100%;background:var(--accent);width:0;transition:width .25s ease}
  .hidden{display:none!important}
  .mic-icon{font-size:1.25rem;vertical-align:-.08em;margin-right:6px}
  .support{margin-top:12px;font-size:.75rem;color:var(--muted);text-align:center}
  @media (max-width:560px){
    body{padding:12px}
    header{margin-top:2px}
    .stats{grid-template-columns:repeat(4,1fr)}
    .stat{padding:8px 3px}
    .card{border-radius:20px}
    .secondary-row{grid-template-columns:1fr}
    .prompt{margin-bottom:24px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow">Prisma Italiaans</div>
      <h1>Les 1</h1>
      <div class="sub">Materiaal t/m p. 11 · 50 kaarten</div>
    </div>
    <button class="reset" id="resetBtn" title="Wis alle lokale voortgang">Reset</button>
  </header>

  <div class="stats">
    <div class="stat"><b id="sTotal">50</b><span>Totaal</span></div>
    <div class="stat"><b id="s1">50</b><span>Bak 1</span></div>
    <div class="stat"><b id="s2">0</b><span>Bak 2</span></div>
    <div class="stat"><b id="s3">0</b><span>Bak 3</span></div>
  </div>
  <div class="progressbar"><div class="progressfill" id="progressfill"></div></div>

  <nav class="tabs" aria-label="Oefenmodus">
    <button class="tab" data-mode="cards">Kaarten</button>
    <button class="tab" data-mode="write">Schrijven</button>
    <button class="tab active" data-mode="speak">Spreken</button>
  </nav>

  <section class="panel" id="cardsPanel">
    <div class="card">
      <div class="meta"><span id="cardsCounter"></span><span class="boxpill" id="cardsBox"></span></div>
      <div class="prompt-label">Nederlands</div>
      <div class="prompt" id="cardsPrompt"></div>
      <div id="cardsAnswer" class="answer hidden"></div>
      <button class="primary" id="showAnswerBtn">Toon antwoord</button>
      <div class="secondary-row hidden" id="gradeButtons">
        <button class="secondary danger" id="wrongBtn">Fout</button>
        <button class="secondary" id="rightBtn">Juist</button>
      </div>
      <button class="secondary" style="width:100%;margin-top:8px" id="skipCardsBtn">Overslaan</button>
    </div>
  </section>

  <section class="panel" id="writePanel">
    <div class="card">
      <div class="meta"><span id="writeCounter"></span><span class="boxpill" id="writeBox"></span></div>
      <div class="prompt-label">Schrijf in het Italiaans</div>
      <div class="prompt" id="writePrompt"></div>
      <div id="writeFeedback" class="feedback"></div>
      <div class="write-wrap">
        <input id="writeInput" class="write-input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Jouw antwoord…">
        <button id="checkWriteBtn" class="smallbtn">Check</button>
      </div>
      <div class="secondary-row">
        <button class="secondary" id="revealWriteBtn">Toon antwoord</button>
        <button class="secondary" id="skipWriteBtn">Overslaan</button>
      </div>
      <div class="help">Spelling, accenten en apostrofs tellen mee. Hoofdletters en eindpunctuatie niet.</div>
    </div>
  </section>

  <section class="panel active" id="speakPanel">
    <div class="card">
      <div class="meta"><span id="speakCounter"></span><span class="boxpill" id="speakBox"></span></div>
      <div class="prompt-label">Zeg in het Italiaans</div>
      <div class="prompt" id="speakPrompt"></div>
      <div id="speakFeedback" class="feedback neutral">Tik op de microfoon en geef je antwoord.</div>

      <button class="primary" id="micBtn"><span class="mic-icon">🎙️</span><span id="micText">Spreek antwoord</span></button>
      <div class="secondary-row">
        <button class="secondary hidden" id="overrideBtn">Ik zei het juist</button>
        <button class="secondary" id="skipSpeakBtn">Overslaan</button>
      </div>
      <div class="support" id="speechSupport"></div>
    </div>
  </section>
</div>

<script>
const CARDS = [
  {nl:"de tramhalte", it:"la fermata del tram"},
  {nl:"de heer / meneer", it:"il signore"},
  {nl:"meneer Tosi", it:"signor Tosi"},
  {nl:"goedendag", it:"buongiorno"},
  {nl:"de mevrouw / mevrouw", it:"la signora"},
  {nl:"hallo / goedendag", it:"salve"},
  {nl:"Hoe gaat het met u?", it:"Come sta?"},
  {nl:"goed", it:"bene"},
  {nl:"bedankt / dank u", it:"grazie"},
  {nl:"en", it:"e"},
  {nl:"u", it:"Lei"},
  {nl:"niet slecht", it:"non c’è male"},
  {nl:"pardon / excuseert u mij", it:"scusi"},
  {nl:"Wie bent u?", it:"Lei chi è?"},
  {nl:"wie", it:"chi"},
  {nl:"ik ben", it:"sono"},
  {nl:"een collega", it:"un collega"},
  {nl:"Nederlands", it:"olandese"},
  {nl:"van meneer Tosi", it:"del signor Tosi"},
  {nl:"aangenaam!", it:"piacere!"},
  {nl:"En hoe heet u?", it:"E Lei come si chiama?"},
  {nl:"Ik heet Valli", it:"mi chiamo Valli"},
  {nl:"hier", it:"qui"},
  {nl:"in Milaan", it:"a Milano"},
  {nl:"voor", it:"per"},
  {nl:"het werk", it:"il lavoro"},
  {nl:"nietwaar? / toch?", it:"vero?"},
  {nl:"waar", it:"vero"},
  {nl:"Kunt u dat alstublieft herhalen?", it:"Può ripetere per favore?"},
  {nl:"herhalen", it:"ripetere"},
  {nl:"alstublieft", it:"per favore"},
  {nl:"spreken", it:"parlare"},
  {nl:"Italiaans", it:"italiano"},
  {nl:"zeker / natuurlijk", it:"certo"},
  {nl:"Italië", it:"Italia"},
  {nl:"normaal gesproken", it:"normalmente"},
  {nl:"ja", it:"sì"},
  {nl:"maar", it:"ma"},
  {nl:"nu", it:"adesso"},
  {nl:"de vakantie", it:"la vacanza"},
  {nl:"kijk / hier is", it:"ecco"},
  {nl:"aankomen", it:"arrivare"},
  {nl:"de tram", it:"il tram"},
  {nl:"dan / dus", it:"allora"},
  {nl:"tot ziens", it:"arrivederci"},
  {nl:"tot ziens (formeel, tegen één persoon)", it:"arrivederLa"},
  {nl:"goedenavond", it:"buonasera"},
  {nl:"hallo / dag", it:"ciao"},
  {nl:"Ik begrijp het niet.", it:"Non capisco."},
  {nl:"Ik spreek niet goed Italiaans.", it:"Non parlo bene l’italiano."}
];

const STORAGE_KEY = "prisma_italiano_l1_v1";
const state = loadState();
let currentId = null;
let turn = state.turn || 0;
let lastId = null;
let mode = "speak";
let recognition = null;
let recognizing = false;
let speechBusy = false;
let wrongAttemptOnCurrent = false;

function defaultCardState(){
  return Object.fromEntries(CARDS.map((_,i)=>[i,{box:1,due:0,seen:0,correct:0,wrong:0}]));
}
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(s && s.cards) return s;
  }catch(e){}
  return {cards:defaultCardState(),turn:0};
}
function saveState(){
  state.turn = turn;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function ensureAllCards(){
  CARDS.forEach((_,i)=>{
    if(!state.cards[i]) state.cards[i]={box:1,due:0,seen:0,correct:0,wrong:0};
  });
}
ensureAllCards();

function counts(){
  const vals = Object.values(state.cards);
  return {
    b1: vals.filter(x=>x.box===1).length,
    b2: vals.filter(x=>x.box===2).length,
    b3: vals.filter(x=>x.box===3).length
  };
}
function updateStats(){
  const c=counts();
  document.getElementById("sTotal").textContent=CARDS.length;
  document.getElementById("s1").textContent=c.b1;
  document.getElementById("s2").textContent=c.b2;
  document.getElementById("s3").textContent=c.b3;
  document.getElementById("progressfill").style.width=((c.b2+c.b3)/CARDS.length*100)+"%";
}
function pickNext(){
  const ids = CARDS.map((_,i)=>i);
  const due = ids.filter(i=>state.cards[i].due<=turn && i!==lastId);
  let pool = due.length?due:ids.filter(i=>i!==lastId);
  if(!pool.length) pool=ids;

  // Geef lagere bakken voorrang, maar meng ze.
  const weighted=[];
  pool.forEach(i=>{
    const b=state.cards[i].box;
    const w=b===1?7:(b===2?3:1);
    for(let k=0;k<w;k++) weighted.push(i);
  });
  return weighted[Math.floor(Math.random()*weighted.length)];
}
function newCard(){
  if(speechBusy) return;
  lastId=currentId;
  currentId=pickNext();
  wrongAttemptOnCurrent=false;
  render();
}
function boxLabel(id){ return "Bak "+state.cards[id].box; }
function counterLabel(){
  const mastered=counts().b3;
  return `${mastered}/${CARDS.length} in Bak 3`;
}
function render(){
  if(currentId===null) currentId=pickNext();
  const card=CARDS[currentId];

  ["cards","write","speak"].forEach(prefix=>{
    document.getElementById(prefix+"Counter").textContent=counterLabel();
    document.getElementById(prefix+"Box").textContent=boxLabel(currentId);
    document.getElementById(prefix+"Prompt").textContent=card.nl;
  });

  // Kaarten
  document.getElementById("cardsAnswer").textContent=card.it;
  document.getElementById("cardsAnswer").classList.add("hidden");
  document.getElementById("showAnswerBtn").classList.remove("hidden");
  document.getElementById("gradeButtons").classList.add("hidden");

  // Schrijven
  const wf=document.getElementById("writeFeedback");
  wf.textContent="";
  wf.className="feedback";
  document.getElementById("writeInput").value="";
  setTimeout(()=>{ if(mode==="write") document.getElementById("writeInput").focus(); },50);

  // Spreken
  const sf=document.getElementById("speakFeedback");
  sf.textContent="Tik op de microfoon en geef je antwoord.";
  sf.className="feedback neutral";
  document.getElementById("overrideBtn").classList.add("hidden");
  setMicState("idle");
  updateStats();
}
function advanceBox(id, hadWrong=false){
  const s=state.cards[id];
  s.seen++;
  s.correct++;
  turn++;
  if(hadWrong){
    s.box=1;
    s.due=turn+3;
  } else if(s.box===1){
    s.box=2;
    s.due=turn+5;
  } else if(s.box===2){
    s.box=3;
    s.due=turn+15;
  } else {
    s.box=3;
    s.due=turn+30;
  }
  saveState(); updateStats();
}
function markWrong(id){
  const s=state.cards[id];
  s.seen++; s.wrong++; s.box=1;
  turn++;
  s.due=turn+3;
  wrongAttemptOnCurrent=true;
  saveState(); updateStats();
}
function skip(){
  turn++;
  state.cards[currentId].due=turn+2;
  saveState();
  newCard();
}
function normalizeSpeech(s){
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[’‘`´]/g,"'")
    .replace(/['"]/g," ")
    .replace(/[.,!?;:()[\]{}]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function normalizeWrite(s){
  return s.toLowerCase()
    .normalize("NFC")
    .replace(/[’‘`´]/g,"'")
    .replace(/[.!?;:]+$/g,"")
    .replace(/\s+/g," ")
    .trim();
}
function speechMatches(heard, expected){
  const h=normalizeSpeech(heard);
  const e=normalizeSpeech(expected);
  if(h===e) return true;

  // Browser-ASR kan "e"/"è" of lidwoord/apostrof als losse tokens weergeven;
  // bovenstaande normalisatie vangt dat op. Alleen zeer kleine transcriptiefouten
  // in langere zinnen krijgen beperkte tolerantie.
  if(e.length>=14){
    const dist=levenshtein(h,e);
    return dist <= Math.max(1, Math.floor(e.length*0.10));
  }
  return false;
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j]=Math.min(
        dp[i-1][j]+1,
        dp[i][j-1]+1,
        dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
      );
    }
  }
  return dp[m][n];
}
function getItalianVoice(){
  const voices=speechSynthesis.getVoices();
  return voices.find(v=>v.lang.toLowerCase()==="it-it") ||
         voices.find(v=>v.lang.toLowerCase().startsWith("it")) || null;
}
function speakItalian(text, then){
  speechBusy=true;
  setMicState("busy");
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="it-IT";
  u.rate=.88;
  u.pitch=1;
  const v=getItalianVoice();
  if(v) u.voice=v;
  u.onend=()=>{speechBusy=false; if(then) then();};
  u.onerror=()=>{speechBusy=false; if(then) then();};
  speechSynthesis.speak(u);
}
function setMicState(s){
  const b=document.getElementById("micBtn");
  const t=document.getElementById("micText");
  b.classList.remove("listening");
  if(s==="listening"){
    b.disabled=false; b.classList.add("listening"); t.textContent="Ik luister…";
  } else if(s==="busy"){
    b.disabled=true; t.textContent="Italiaanse herhaling…";
  } else {
    b.disabled=false; t.textContent=wrongAttemptOnCurrent?"Probeer opnieuw":"Spreek antwoord";
  }
}
function setupRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const support=document.getElementById("speechSupport");
  if(!SR){
    support.textContent="Spraakherkenning is in deze browser niet beschikbaar. Open de app in Chrome of Edge.";
    document.getElementById("micBtn").disabled=true;
    return;
  }
  recognition=new SR();
  recognition.lang="it-IT";
  recognition.interimResults=false;
  recognition.continuous=false;
  recognition.maxAlternatives=5;

  recognition.onstart=()=>{
    recognizing=true;
    setMicState("listening");
    const f=document.getElementById("speakFeedback");
    f.textContent="Spreek nu…";
    f.className="feedback neutral";
  };
  recognition.onresult=(ev)=>{
    const alternatives=[];
    for(let i=0;i<ev.results[0].length;i++) alternatives.push(ev.results[0][i].transcript);
    checkSpoken(alternatives);
  };
  recognition.onerror=(ev)=>{
    recognizing=false;
    setMicState("idle");
    const f=document.getElementById("speakFeedback");
    if(ev.error==="no-speech"){
      f.textContent="Ik hoorde niets. Probeer opnieuw.";
    } else if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){
      f.textContent="Microfoontoegang is niet toegestaan. Geef deze pagina microfoontoegang.";
    } else {
      f.textContent="Spraakherkenning lukte niet. Probeer opnieuw.";
    }
    f.className="feedback bad";
  };
  recognition.onend=()=>{
    recognizing=false;
    if(!speechBusy) setMicState("idle");
  };
  support.textContent="Italiaanse spraakherkenning · één antwoord per kaart";
}
function checkSpoken(alternatives){
  recognizing=false;
  const expected=CARDS[currentId].it;
  const matched=alternatives.some(x=>speechMatches(x,expected));
  const heard=alternatives[0]||"";
  const f=document.getElementById("speakFeedback");

  if(matched){
    advanceBox(currentId, wrongAttemptOnCurrent);
    f.textContent="Juist ✓";
    f.className="feedback good";
    document.getElementById("overrideBtn").classList.add("hidden");

    // Exact gewenste flow:
    // correct → Italiaanse modelantwoord uitspreken → pas daarna volgende kaart.
    speakItalian(expected, ()=>{
      setTimeout(()=>newCard(), 260);
    });
  } else {
    markWrong(currentId);
    f.textContent=`Nog niet juist. Ik hoorde: “${heard || "—"}”`;
    f.className="feedback bad";
    document.getElementById("overrideBtn").classList.remove("hidden");
    setMicState("idle");
  }
}
function startRecognition(){
  if(!recognition||speechBusy) return;
  if(recognizing){
    try{ recognition.stop(); }catch(e){}
    return;
  }
  try{ recognition.start(); }catch(e){}
}

// Tabs
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    mode=btn.dataset.mode;
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===btn));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    document.getElementById(mode+"Panel").classList.add("active");
    if(mode==="write") setTimeout(()=>document.getElementById("writeInput").focus(),50);
  });
});

// Kaarten
document.getElementById("showAnswerBtn").onclick=()=>{
  document.getElementById("cardsAnswer").classList.remove("hidden");
  document.getElementById("showAnswerBtn").classList.add("hidden");
  document.getElementById("gradeButtons").classList.remove("hidden");
};
document.getElementById("rightBtn").onclick=()=>{ advanceBox(currentId,false); newCard(); };
document.getElementById("wrongBtn").onclick=()=>{ markWrong(currentId); newCard(); };
document.getElementById("skipCardsBtn").onclick=skip;

// Schrijven
function checkWrite(){
  const input=document.getElementById("writeInput").value;
  const expected=CARDS[currentId].it;
  const f=document.getElementById("writeFeedback");
  if(normalizeWrite(input)===normalizeWrite(expected)){
    advanceBox(currentId,wrongAttemptOnCurrent);
    f.textContent="Juist ✓";
    f.className="feedback good";
    setTimeout(()=>newCard(),520);
  } else {
    markWrong(currentId);
    f.textContent="Nog niet juist. Probeer opnieuw.";
    f.className="feedback bad";
  }
}
document.getElementById("checkWriteBtn").onclick=checkWrite;
document.getElementById("writeInput").addEventListener("keydown",e=>{if(e.key==="Enter")checkWrite();});
document.getElementById("revealWriteBtn").onclick=()=>{
  markWrong(currentId);
  const f=document.getElementById("writeFeedback");
  f.textContent="Correct: "+CARDS[currentId].it;
  f.className="feedback neutral";
};
document.getElementById("skipWriteBtn").onclick=skip;

// Spreken
document.getElementById("micBtn").onclick=startRecognition;
document.getElementById("skipSpeakBtn").onclick=skip;
document.getElementById("overrideBtn").onclick=()=>{
  const f=document.getElementById("speakFeedback");
  // De kaart is al naar Bak 1 gezet door de mislukte herkenning.
  // Handmatige override behandelt de uitspraak als correct, maar promoveert
  // na een misser niet meteen voorbij Bak 1.
  advanceBox(currentId,true);
  f.textContent="Juist gemarkeerd ✓";
  f.className="feedback good";
  document.getElementById("overrideBtn").classList.add("hidden");
  speakItalian(CARDS[currentId].it,()=>setTimeout(()=>newCard(),260));
};

// Reset
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("Alle voortgang voor les 1 wissen en alle 50 kaarten terug in Bak 1 zetten?")){
    state.cards=defaultCardState(); turn=0; state.turn=0; saveState(); currentId=null; lastId=null; newCard();
  }
};

if("speechSynthesis" in window){
  speechSynthesis.getVoices();
  if(typeof speechSynthesis.onvoiceschanged!=="undefined") speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
}
setupRecognition();
updateStats();
newCard();
</script>
</body>
</html>
